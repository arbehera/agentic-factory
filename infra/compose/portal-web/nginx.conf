# Portal web (P0-WP11): static app; /api goes to the portal API. Live logs stream unbuffered.
server {
  listen 8080;
  root /usr/share/nginx/html;
  # Resolve portal-api per request through Docker's DNS: a recreated portal-api gets a new address,
  # and a name resolved once at start-up would keep pointing at the old one (502s).
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $portal_api http://portal-api:3002;
    proxy_pass $portal_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location / {
    try_files $uri /index.html;
  }
}

# Portal web (P0-WP11): static app; /api goes to the portal API. Live logs stream unbuffered.
server {
  listen 8080;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://portal-api:3002;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location / {
    try_files $uri /index.html;
  }
}
